# macOS 版的建置（src/Myriagent.Mac）與 Windows 版的編譯檢查。
# macOS 版和 Windows 版編譯同一批原始碼：改到共用的檔案時，兩邊都要編得過。
name: mac

on:
  push:
    branches: [mac-port, "mac/**"]
  pull_request:
    paths: ["src/**", "tests/**", "Directory.Build.*", ".github/workflows/mac.yml"]
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-app:
    name: macOS app
    # mac/mutation-* 是驗證測試用的分支（故意改壞一處，看 Windows 上的測試會不會紅）：不必建 macOS 版
    if: ${{ !startsWith(github.ref_name, 'mac/mutation') }}
    # Intel 的機器：要給人用的就是 x64 的版本（冒煙測試直接跑原生的執行檔），而且 arm64 的機器常常排不到
    #（2026-11-19 等了一個多小時，job 被 GitHub 以「not acquired by Runner」取消了好幾次）
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i xcode || true
          dotnet --info | head -20
      # 在 src/Myriagent.Mac 底下執行：那裡的 global.json 指定用 .NET 10 的 SDK（它的 macOS workload 對應 Xcode 26；
      # 機器上更新的 SDK 帶的 workload 會要求還沒出的 Xcode）
      - name: Install macOS workload
        working-directory: src/Myriagent.Mac
        run: |
          dotnet --version
          dotnet workload install macos
      - name: Build
        # shell: bash 才有 pipefail：沒有的話 tee 會蓋掉 dotnet build 的失敗
        shell: bash
        working-directory: src/Myriagent.Mac
        run: dotnet build Myriagent.Mac.csproj -c Release -nologo -clp:NoSummary 2>&1 | tee ../../build.log
      # 真的把 app 跑起來：獨立的資料夾（不找、不執行這台的任何 CLI），介面載入後 app 自己把網頁的樣子寫成 smoke.json 再結束
      - name: Smoke run
        shell: bash
        run: |
          set +e
          set -uo pipefail
          APP=$(find src/Myriagent.Mac/bin/Release -maxdepth 4 -name '*.app' | head -1)
          echo "APP=$APP"
          test -n "$APP"
          ls "$APP/Contents" "$APP/Contents/MacOS"
          du -sh "$APP"
          DATA="$RUNNER_TEMP/myriagent-data"
          export MYRIAGENT_MAC_SMOKE="$PWD/smoke.json"
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -1)
          echo "BIN=$BIN"
          "$BIN" --data "$DATA" > app-stdout.log 2>&1 &
          PID=$!
          for i in $(seq 1 70); do
            if ! kill -0 $PID 2>/dev/null; then break; fi
            if [ "$i" = "30" ]; then screencapture -x screen-30s.png || true; fi
            sleep 1
          done
          if kill -0 $PID 2>/dev/null; then echo "app still running after 70s: killing" | tee smoke-run.txt; sample $PID 2 -file sample.txt >/dev/null 2>&1; grep -v CallDescrWorkerInternal sample.txt | cut -c1-240 | head -150; kill -9 $PID; fi
          wait $PID
          echo "exit code: $?"
          echo "--- stdout/stderr"; tail -60 app-stdout.log || true
          echo "--- app log"; cat "$DATA"/logs/*.log 2>/dev/null | tail -80 || true
          echo "--- smoke.json"; cat smoke.json
          python3 - <<'PY'
          import json, sys
          r = json.load(open('smoke.json'))
          problems = []
          if not r.get('loaded'): problems.append('interface did not load')
          if r.get('origin') != 'https://myriagent.local': problems.append('origin is %r' % r.get('origin'))
          if not r.get('bridge'): problems.append('host bridge missing')
          if not r.get('secure'): problems.append('not a secure context')
          if (r.get('nodes') or 0) < 50: problems.append('page looks empty (%s nodes)' % r.get('nodes'))
          if problems: sys.exit('SMOKE FAILED: ' + '; '.join(problems))
          print('SMOKE OK:', r.get('title'), r.get('nodes'), 'nodes')
          PY
          SMOKE=$?
          # app 要自己結束（冒煙測試寫完結果就走結束流程）：被我們強制結束的不算過
          if [ "$SMOKE" != "0" ]; then exit 1; fi
          if grep -q 'still running after' smoke-run.txt 2>/dev/null; then echo "SMOKE FAILED: app did not exit by itself"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke
          if-no-files-found: ignore
          path: |
            smoke.json
            smoke.json.png
            screen-*.png
            app-stdout.log
            sample.txt
      # 建好的 app 打包成 zip（ditto 會保留符號連結與執行權限）給人下載試用
      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src/Myriagent.Mac/bin/Release -maxdepth 4 -name '*.app' | head -1)
          ARCH=$(basename "$(dirname "$APP")")
          # 臨時簽章（不需要開發者帳號）：沒有任何簽章的 app 要不到系統通知的權限，在 Apple 晶片的 Mac 上也不能執行
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" "Clode-Myriagent-$ARCH.zip"
          ls -la Clode-Myriagent-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: Clode-Myriagent-*.zip
          compression-level: 0
      - name: Error summary
        if: failure()
        shell: bash
        run: |
          grep -E ': error ' build.log | sed -E 's/ \[[^]]*\]$//' | sort -u > errors.txt || true
          wc -l errors.txt
          echo "--- by code ---"
          grep -oE 'error [A-Z]+[0-9]+' errors.txt | sort | uniq -c | sort -rn | head -40
          echo "--- by file ---"
          sed -E 's/\([0-9,]+\).*//' errors.txt | sort | uniq -c | sort -rn | head -150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-build-log
          path: |
            build.log
            errors.txt

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Myriagent.slnx -c Release -nologo
      # 這個分支在共用的程式裡改到的功能的測試：測試專案是 Windows 的，在這裡跑。整套測試要很久，只跑相關的類別：
      # 使用現有的設定資料夾（名稱含 ExistingFolder 的、帳戶管理員、共用設定的規則）、排程（macOS 的 launchd／crontab 規則與原本的排程規則）、
      # 執行列與遠端執行指令（開程序的部分拆成各平台自己的）
      # 原本的測試有幾個以作者的時區寫死預期的時刻（帶 +08:00 的時間換成本機時間）：測試機照樣設成台北時間
      - name: Time zone
        run: tzutil /s "Taipei Standard Time"
      - name: Tests (mac-port changes)
        run: dotnet test tests/Myriagent.Tests/Myriagent.Tests.csproj -c Release --no-build --nologo --filter "FullyQualifiedName~ExistingFolder|FullyQualifiedName~AccountManagerTests|FullyQualifiedName~SharedCustomizationRulesTests|FullyQualifiedName~Launchd|FullyQualifiedName~CronRules|FullyQualifiedName~ScheduleRulesTests|FullyQualifiedName~AgentHubSchedulesTests|FullyQualifiedName~TranscriptOriginTests|FullyQualifiedName~TaskSchedulerReaderTests|FullyQualifiedName~TimedMessage|FullyQualifiedName~Tests.Launch.|FullyQualifiedName~Tests.RemoteExec.|FullyQualifiedName~GitStatusRulesTests" --logger "console;verbosity=minimal"

  web-rules:
    name: Web rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 介面網頁的純規則（tools/ui-probe/*.test.mjs）：不需要瀏覽器，也不需要安裝套件
      - name: Test
        shell: bash
        run: node --test tools/ui-probe/*.test.mjs
