# macOS 版的建置（src/Myriagent.Mac）與 Windows 版的編譯檢查。
# macOS 版和 Windows 版編譯同一批原始碼：改到共用的檔案時，兩邊都要編得過。
name: mac

on:
  push:
    branches: [mac-port, "mac/**"]
  pull_request:
    paths: ["src/**", "tests/**", "Directory.Build.*", ".github/workflows/mac.yml"]
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-app:
    name: macOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i xcode || true
          dotnet --info | head -20
      # 在 src/Myriagent.Mac 底下執行：那裡的 global.json 指定用 .NET 10 的 SDK（它的 macOS workload 對應 Xcode 26；
      # 機器上更新的 SDK 帶的 workload 會要求還沒出的 Xcode）
      - name: Install macOS workload
        working-directory: src/Myriagent.Mac
        run: |
          dotnet --version
          dotnet workload install macos
      - name: Build
        # shell: bash 才有 pipefail：沒有的話 tee 會蓋掉 dotnet build 的失敗
        shell: bash
        working-directory: src/Myriagent.Mac
        run: dotnet build Myriagent.Mac.csproj -c Release -nologo -clp:NoSummary 2>&1 | tee ../../build.log
      # 真的把 app 跑起來：獨立的資料夾（不找、不執行這台的任何 CLI），介面載入後 app 自己把網頁的樣子寫成 smoke.json 再結束
      - name: Smoke run
        shell: bash
        run: |
          set +e
          set -uo pipefail
          APP=$(find src/Myriagent.Mac/bin/Release -maxdepth 4 -name '*.app' | head -1)
          echo "APP=$APP"
          test -n "$APP"
          ls "$APP/Contents" "$APP/Contents/MacOS"
          du -sh "$APP"
          DATA="$RUNNER_TEMP/myriagent-data"
          export MYRIAGENT_MAC_SMOKE="$PWD/smoke.json"
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -1)
          echo "BIN=$BIN"
          "$BIN" --data "$DATA" > app-stdout.log 2>&1 &
          PID=$!
          for i in $(seq 1 70); do
            if ! kill -0 $PID 2>/dev/null; then break; fi
            if [ "$i" = "6" ]; then screencapture -x screen-06s.png || true; fi
            if [ "$i" = "12" ]; then screencapture -x screen-12s.png || true; fi
            sleep 1
          done
          if kill -0 $PID 2>/dev/null; then echo "app still running after 70s: killing" | tee smoke-run.txt; sample $PID 2 -file sample.txt >/dev/null 2>&1; head -80 sample.txt; kill -9 $PID; fi
          wait $PID
          echo "exit code: $?"
          echo "--- stdout/stderr"; tail -60 app-stdout.log || true
          echo "--- app log"; cat "$DATA"/logs/*.log 2>/dev/null | tail -80 || true
          echo "--- smoke.json"; cat smoke.json
          python3 - <<'PY'
          import json, sys
          r = json.load(open('smoke.json'))
          problems = []
          if not r.get('loaded'): problems.append('interface did not load')
          if r.get('origin') != 'https://myriagent.local': problems.append('origin is %r' % r.get('origin'))
          if not r.get('bridge'): problems.append('host bridge missing')
          if not r.get('secure'): problems.append('not a secure context')
          if (r.get('nodes') or 0) < 50: problems.append('page looks empty (%s nodes)' % r.get('nodes'))
          if problems: sys.exit('SMOKE FAILED: ' + '; '.join(problems))
          print('SMOKE OK:', r.get('title'), r.get('nodes'), 'nodes')
          PY
          SMOKE=$?
          # app 要自己結束（冒煙測試寫完結果就走結束流程）：被我們強制結束的不算過
          if [ "$SMOKE" != "0" ]; then exit 1; fi
          if grep -q 'still running after' smoke-run.txt 2>/dev/null; then echo "SMOKE FAILED: app did not exit by itself"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke
          if-no-files-found: ignore
          path: |
            smoke.json
            screen-*.png
            app-stdout.log
      - name: Error summary
        if: failure()
        shell: bash
        run: |
          grep -E ': error ' build.log | sed -E 's/ \[[^]]*\]$//' | sort -u > errors.txt || true
          wc -l errors.txt
          echo "--- by code ---"
          grep -oE 'error [A-Z]+[0-9]+' errors.txt | sort | uniq -c | sort -rn | head -40
          echo "--- by file ---"
          sed -E 's/\([0-9,]+\).*//' errors.txt | sort | uniq -c | sort -rn | head -150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-build-log
          path: |
            build.log
            errors.txt

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Myriagent.slnx -c Release -nologo
